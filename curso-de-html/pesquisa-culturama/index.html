<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="./css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <main>
        <header>
        <img src="./img/logo-culturama.png" alt="Logo do Culturama">
        <h1>Pesquisa Online</h1>
        </header>
    </main>
    <section>
            <form action="sucesso.html" method="get">
            <fieldset>
            <!-- DADOS DO USUÁRIO-->
            <legend>Dados do Usuário</legend>
            <label for="name">Nome</label>
            <input id="name" type="text" name="userName" required>
            <br>
            <label for="age">Idade</label>
            <input id="age"type="number" name="age" min="12" max="100">
            <br>
            <label for="birthDate">Data de Nascimento</label>
            <input id="birthDate" type="date" name="birthDate">
            <br>
            <label for="email">E-mail</label>
            <input id="email" type="email" name="userEmail" required>
            <br>
            <label for="phoneNumber">Telefone</label>
            <input id="phoneNumber" type="tel" name="userNumberPhone" pattern="[0-9]{11}" placeholder="DDD + numeros sem espaços ou hifen" aria-describedby="phoneHelp">
            <small id="phoneHelp">Preencha com 11 digitos no formato: DDD + número sem espaços ou hifen.</small>
            <br>
            <label for="image">Upload de Imagem</label>
            <input id="image" type="file" accept="image/*" name="userImage">
            <small>Envie uma foto no formato PNG ou JPEG.</small>
            <br>
        </fieldset>

        <fieldset>
                <legend>Perfil</legend>
                <p>Gênero:</p>
                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>
                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>
                <input id="notInformed" type="radio" name="userGender" value="notInformed">
                <label for="notInformed">Prefiro não informar</label>

                <label for="maritalStatus">Estado civil:</label>
                <select id="maritalStatus" name="maritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="casado">União Estavel</option>
                </select>

                <label for="userState">Estado:</label>
                <select id="userState" name="userState" required>
                    <option value="acre">Acre </option>
                    <option value="alagoas">Alagoas </option>
                    <option value="amapa">Amapá </option>
                    <option value="amazonas">Amazonas </option>
                    <option value="bahia">Bahia </option>
                    <option value="ceara">Ceará </option>
                    <option value="distritoFederal">Distrito Federal </option>
                    <option value="espiritoSanto">Espirito Santo </option>
                    <option value="goias">Goiás </option>
                    <option value="maranhao">Maranhão </option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul </option>
                    <option value="matoGrosso">Mato Grosso </option>
                    <option value="minasGerais">Minas Gerais </option>
                    <option value="para">Pará </option>
                    <option value="paraiba">Paraíba </option>
                    <option value="parana">Paraná </option>
                    <option value="pernambuco">Pernambuco </option>
                    <option value="piaui">Piauí </option>
                    <option value="rioDeJaneiro">Rio de Janeiro </option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte </option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul </option>
                    <option value="rondonia">Rondônia </option>
                    <option value="roraima">Roraima </option>
                    <option value="santaCatarina">Santa Catarina </option>
                    <option value="saoPaulo">São Paulo </option>
                    <option value="sergipe">Sergipe </option>
                    <option value="tocantins">Tocantins </option>
                    <br>
                    <label for="userCity">Cidade</label>
                    <input type="text" name="userCity" required>
                </select>
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais</p>
                <input id="instagram" type="checkbox" name="socialMedia" value="social">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="socialMedia" value="social">
                <label for="facebook">Facebook</label>
                <br>
                <input id="linkedin" type="checkbox" name="socialMedia" value="social">
                <label for="linkedin">Linkedin</label>
                <br>
                <input id="x" type="checkbox" name="socialMedia" value="social">
                <label for="x">X</label>
                <br>
                <input id="musicStyle" type="checkbox" name="socialMedia" value="social">
                <label for="musicStyle">Spotify</label>
                <details id="stylesTypes">
                    <option value="rock">Rock</option>
                    <option value="pop">Pop</option>
                    <option value="sertanejo">Sertanejo</option>
                    <option value="pagode">Samba</option>
                </details>
                <br>
            </fieldset>
            <fieldset>
                <legend>Opinião</legend>
                <input id="otimo" type="radio" name="userServiceOpinion" value="otima">
                <label for="otimo">Ótima</label>
                <br>
                <input id="boa" type="radio" name="userServiceOpinion" value="boa">
                <label for="boa">Boa</label>
                <br>
                <input id="regular" type="radio" name="userServiceOpinion" value="regular">
                <label for="regular">Regular</label>
                <br>
                <input id="ruim" type="radio" name="userServiceOpinion" value="ruim">
                <label for="ruim">Ruim</label>
                <br>
                <label for="comment">O que você acha do Culturama?</label>
                <textarea id="comment" name="userComment" rows="4" cols="50" placeholder="Escreva sua opinião aqui..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>
                <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accepted" required>
                <label for="userLgptTerm">Eu aceito participar da pesquisa</label>

                <input type="checkbox" name="userGetResult" id="getResult" value="accepted" required>
                <label for="userLgptTerm">Eu li e aceito os termos de uso</label>
                </fieldset>
            <button type="submit" aria-label="Enviar dados ao formulário">Enviar</button>
            <button type="reset" aria-label="Enviar dados ao formulário">Limpar</button>+

        </form>
    </section>
</body>
</html>
