<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <p>Listas</p>
    <p>Lista ordenada</p>
    <ol type="1" start="5">
      <li>pegue os ovos e coloque na batedeira</li>
      <li>colocar o chocolate</li>
      <li>coloque a farinha</li>
      <li>coloque o açúcar</li>
      <li>coloque o leite</li>
    </ol>
    <p>Lista desordenada</p>
    <ul>
      <li>comprar café</li>
      <li>comprar leite</li>
      <li>comprar sabão</li>
      <li>
        <ul type="a">
          <li>sabão</li>
          <li>detergente</li>
          <li>água sanitária</li>
        </ul>
      </li>
    </ul>
</body>
</html>
